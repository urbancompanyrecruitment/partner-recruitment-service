services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: recruitment
      POSTGRES_PASSWORD: recruitment
      POSTGRES_DB: partner_recruitment
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/docker-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruitment -d partner_recruitment"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
